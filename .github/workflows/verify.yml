name: Verify tickets & update WP

on:
  workflow_dispatch:
    inputs:
      recheck:
        description: 'Re-check already decided rows on the newest posts?'
        type: boolean
        default: false
      recheck_last_n:
        description: 'How many newest posts to re-scan'
        default: '15'
  schedule:
    - cron: "0 18-23 * * *"
    - cron: "0 0-2 * * *"
    - cron: "0 5 * * *"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verify
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install deps
        run: |
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 --no-fund --no-audit --prefer-offline

      # -------------------------------
      # VERIFY – PARIUVERDE.RO (RO)
      # -------------------------------
      - name: Verify tickets (pariuverde.ro)
        if: success()
        env:
          LANG: "ro"
          WP_BASE: https://pariuverde.ro
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          HOMEPAGE_ID: "11"
          MAX_POSTS_PER_CAT: "8"
          RECHECK_ONCE: ${{ inputs.recheck && '1' || '0' }}
          RECHECK_LAST_N: ${{ inputs.recheck_last_n }}
        run: node verify_and_update_wp.js

      # -------------------------------
      # VERIFY – GREENBETTIPS.COM (EN)
      # -------------------------------
      - name: Verify tickets (greenbettips.com)
        if: success()
        env:
          LANG: "en"
          WP_BASE: https://greenbettips.com
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
          HOMEPAGE_ID: "2"
          MAX_POSTS_PER_CAT: "8"
          RECHECK_ONCE: ${{ inputs.recheck && '1' || '0' }}
          RECHECK_LAST_N: ${{ inputs.recheck_last_n }}
        run: node verify_and_update_wp.js
