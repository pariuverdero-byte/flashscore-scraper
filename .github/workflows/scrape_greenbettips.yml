name: Scrape Flashscore + Claudiu Pool + TalkFootball + PredictZ + Generate Tickets + WordPress (EN)

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"  # 14:35 RO (GitHub = UTC)

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      DAY_OFFSET: "0"
      INCLUDE_LIVE: "true"
      LANG: "en"

      CLAUDIU_MIN_ODD: "1.15"

      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"
      PV_COTA2_TOL: "0.00"

      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"
      PV_ZI_TOL: "0.00"

    steps:
      # ------------------
      # SETUP
      # ------------------
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-greenbettips
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 \
            --no-fund --no-audit --prefer-offline

      # ------------------
      # 1) FLASHSCORE
      # ------------------
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ------------------
      # 2) CLAUDIU
      # ------------------
      - name: Build Claudiu Hood POOL
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ------------------
      # 3) TALKFOOTBALL
      # ------------------
      - name: Scrape TalkFootball
        timeout-minutes: 5
        run: node scrapers/scrape_talkfootball.js

      - name: Match TalkFootball to Flashscore
        timeout-minutes: 5
        run: node engine/match_talkfootball_flashscore.js

      - name: Inject TalkFootball into MASTER pool
        timeout-minutes: 5
        run: node parsers/parse_talkfootball_as_odds.js

      # ------------------
      # 4) PREDICTZ
      # ------------------
      - name: Scrape PredictZ
        timeout-minutes: 5
        run: node scrapers/scrape_predictz.js

      - name: Match PredictZ to Flashscore
        timeout-minutes: 5
        run: node engine/match_predictz_flashscore.js

      - name: Inject PredictZ into MASTER pool
        timeout-minutes: 5
        run: node parsers/parse_predictz_as_odds.js

      # ------------------
      # 5) GENERATE TICKETS
      # ------------------
      - name: Generate tickets from MASTER pool
        timeout-minutes: 5
        run: node generate_tickets_from_pool.js

      # ------------------
      # 6) WORDPRESS HTML
      # ------------------
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ------------------
      # 7) ARTIFACTS
      # ------------------
      - name: Upload artifacts (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output
          path: |
            matches.json
            claudiu_pool.json
            master_pool.json

            predictz_pool.json
            predictz_matched.json

            predictz_match_tips.html
            predictz_btts.html
            predictz_btts_and_win.html
            predictz_over_under_25.html

            claudiu_cota2.html
            claudiu_biletul_zilei.html
            claudiu_varianta_speciala.html
            claudiu_varianta_rezerva.html
            claudiu_varianta_islanda.html

            artifacts/talkfootball_pool.json
            artifacts/talkfootball_matched.json
            artifacts/talkfootball_dropped.json

      - name: Upload artifacts (tickets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets
          path: |
            tickets.json
            tickets.md
            cota2.html
            biletul-zilei.html

      # ------------------
      # 8) PUBLISH
      # ------------------
      - name: Publish posts to WordPress (greenbettips.com)
        if: success()
        env:
          WP_URL: https://greenbettips.com
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
        run: node publish_wp.js

      # ------------------
      # 9) YOUTUBE SHORTS PAYLOAD
      # ------------------
      - name: Generate YouTube Shorts payload
        if: success()
        env:
          WP_URL: https://greenbettips.com
          SHORTS_TICKET_TYPE: bilet_cota2
        run: node shorts/generate_shorts_payload.js

      - name: Upload Shorts payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-payload
          path: |
            published_posts.json
            output/shorts_payload.json
            output/voice_script.txt
          if-no-files-found: warn
