name: Scrape Flashscore + Claudiu Pool + TalkFootball + Generate Tickets + WordPress (EN)

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"  # 14:35 RO (GitHub = UTC)

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      # ------------------
      # GLOBAL CONTROLS
      # ------------------
      DAY_OFFSET: "0"        # 0 = today, -1 = yesterday
      INCLUDE_LIVE: "true"

      # ------------------
      # LANGUAGE (CRITICAL)
      # ------------------
      LANG: "en"

      # ------------------
      # CLAUDIU POOL RULES
      # ------------------
      CLAUDIU_MIN_ODD: "1.15"

      # ------------------
      # GREENBETTIPS – ODDS 2
      # ------------------
      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"
      PV_COTA2_TOL: "0.00"

      # ------------------
      # GREENBETTIPS – BET OF THE DAY
      # ------------------
      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"
      PV_ZI_TOL: "0.00"

    steps:
      # ------------------
      # SETUP
      # ------------------
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-greenbettips
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 \
            --no-fund --no-audit --prefer-offline

      # ------------------
      # 1) FLASHSCORE FIXTURES
      # ------------------
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ------------------
      # 2) CLAUDIU HOOD → POOL
      # ------------------
      - name: Build Claudiu Hood POOL
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ------------------
      # 3) TALKFOOTBALL → SCRAPE
      # ------------------
      - name: Scrape TalkFootball
        timeout-minutes: 5
        run: node scrapers/scrape_talkfootball.js

      # ------------------
      # 4) TALKFOOTBALL → MATCH FLASHCORE
      # ------------------
      - name: Match TalkFootball to Flashscore
        timeout-minutes: 5
        run: node engine/match_talkfootball_flashscore.js

      # ------------------
      # 5) TALKFOOTBALL → ODD SOURCE
      # ------------------
      - name: Inject TalkFootball odds into MASTER pool
        timeout-minutes: 5
        run: node parsers/parse_talkfootball_as_odds.js

      # ------------------
      # 6) MASTER POOL → TICKETS
      # ------------------
      - name: Generate tickets from MASTER pool
        timeout-minutes: 5
        run: node generate_tickets_from_pool.js

      # ------------------
      # 7) WORDPRESS HTML
      # ------------------
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ------------------
      # 8) ARTIFACTS (DEBUG / TRACE)
      # ------------------
      - name: Upload artifacts (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output
          path: |
            matches.json
            claudiu_pool.json
            master_pool.json
            artifacts/talkfootball_pool.json
            artifacts/talkfootball_matched.json
            artifacts/talkfootball_dropped.json

      - name: Upload artifacts (tickets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets
          path: |
            tickets.json
            tickets.md
            cota2.html
            biletul-zilei.html

      # ------------------
      # 9) PUBLISH → GREENBETTIPS.COM
      # ------------------
      - name: Publish posts to WordPress (greenbettips.com)
        if: success()
        env:
          WP_URL: https://greenbettips.com
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
        run: node publish_wp.js
