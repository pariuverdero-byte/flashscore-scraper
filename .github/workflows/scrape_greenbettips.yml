name: GreenBetTips Daily Tickets + WordPress + YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    # 13:30 UTC = 14:30 in Romania during daylight-saving time (summer).
    # During winter, change this cron to "30 14 * * *" to keep 16:30 Romania time.
    - cron: "30 11 * * *"

jobs:
  scrape-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      DAY_OFFSET: "0"
      INCLUDE_LIVE: "true"
      LANG: "en"

      CLAUDIU_MIN_ODD: "1.15"

      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"
      PV_COTA2_TOL: "0.00"

      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"
      PV_ZI_TOL: "0.00"

      SHORTS_OUTPUT_ROOT: "output"
      SHORTS_PRESENTER_FILES: "assets/presenters/en_presenter_01.mp4,assets/presenters/en_presenter_02.mp4,assets/presenters/en_presenter_03.mp4,assets/presenters/presenter-01.mp4"
      SHORTS_TTS_VOICE: "en-US-AndrewNeural"
      SHORTS_TTS_RATE: "+2%"
      SHORTS_TTS_PITCH: "+1Hz"

      SHORTS_PRESENTER_SCALE_MIN: "0.88"
      SHORTS_PRESENTER_SCALE_MAX: "1.02"
      SHORTS_PRESENTER_OFFSET_X_MIN: "-110"
      SHORTS_PRESENTER_OFFSET_X_MAX: "110"
      SHORTS_PRESENTER_OFFSET_Y_MIN: "10"
      SHORTS_PRESENTER_OFFSET_Y_MAX: "70"
      SHORTS_PRESENTER_MIRROR_CHANCE: "0.35"

      SHORTS_BACKGROUND_CHANGE_MIN_SECONDS: "3"
      SHORTS_BACKGROUND_CHANGE_MAX_SECONDS: "6"
      SHORTS_BACKGROUND_VARIANT_COUNT: "18"

      YOUTUBE_PRIVACY_STATUS: "public"

    steps:
      # ==================================================
      # SETUP
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-greenbettips
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: |
          npm install \
            cheerio@^1.0.0-rc.12 \
            node-fetch@^3 \
            googleapis \
            --no-fund \
            --no-audit \
            --prefer-offline

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          edge-tts --version

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core

          ffmpeg -version
          ffprobe -version

      # ==================================================
      # 1) FLASHSCORE
      # ==================================================
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ==================================================
      # 2) CLAUDIU
      # ==================================================
      - name: Build Claudiu Hood pool
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ==================================================
      # 3) TALKFOOTBALL
      # ==================================================
      - name: Scrape TalkFootball
        timeout-minutes: 5
        run: node scrapers/scrape_talkfootball.js

      - name: Match TalkFootball to Flashscore
        timeout-minutes: 5
        run: node engine/match_talkfootball_flashscore.js

      - name: Inject TalkFootball into master pool
        timeout-minutes: 5
        run: node parsers/parse_talkfootball_as_odds.js

      # ==================================================
      # 4) PREDICTZ
      # ==================================================
      - name: Scrape PredictZ
        timeout-minutes: 5
        run: node scrapers/scrape_predictz.js

      - name: Match PredictZ to Flashscore
        timeout-minutes: 5
        run: node engine/match_predictz_flashscore.js

      - name: Inject PredictZ into master pool
        timeout-minutes: 5
        run: node parsers/parse_predictz_as_odds.js

      # ==================================================
      # 5) GENERATE TICKETS
      # ==================================================
      - name: Generate tickets from master pool
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna"
        run: node generate_tickets_from_pool.js

      # ==================================================
      # 6) WORDPRESS HTML
      # ==================================================
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ==================================================
      # 7) RAW + TICKET ARTIFACTS
      # ==================================================
      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output
          path: |
            matches.json
            claudiu_pool.json
            master_pool.json

            predictz_pool.json
            predictz_matched.json

            predictz_match_tips.html
            predictz_btts.html
            predictz_btts_and_win.html
            predictz_over_under_25.html

            claudiu_cota2.html
            claudiu_biletul_zilei.html
            claudiu_varianta_speciala.html
            claudiu_varianta_rezerva.html
            claudiu_varianta_islanda.html

            artifacts/talkfootball_pool.json
            artifacts/talkfootball_matched.json
            artifacts/talkfootball_dropped.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ticket artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets
          path: |
            tickets.json
            tickets.md
            cota2.html
            biletul-zilei.html
          if-no-files-found: warn
          retention-days: 7

      # ==================================================
      # 8) WORDPRESS PUBLISHING
      # ==================================================
      - name: Publish posts to WordPress
        if: success()
        env:
          WP_URL: https://greenbettips.com
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
        run: node publish_wp.js

      # ==================================================
      # 9A) ODDS 2 PAYLOAD
      # ==================================================
      - name: Generate Odds 2 Shorts payload
        if: success()
        env:
          LANG: "en"
          WP_URL: https://greenbettips.com
          SHORTS_SITE_URL: https://greenbettips.com
          SHORTS_TICKET_TYPE: bilet_cota2
          SHORTS_OUTPUT_DIR: output/bilet_cota2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/bilet_cota2

          node shorts/generate_shorts_payload.js

          if [ ! -s output/bilet_cota2/shorts_payload.json ]; then
            echo "Odds 2 payload was not generated."
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync(
                'output/bilet_cota2/shorts_payload.json',
                'utf8'
              )
            );

            console.log('Odds 2 status:', payload.status);
            console.log('Ticket type:', payload.ticketType);
            console.log('Ticket label:', payload.ticketLabel);
          "

      # ==================================================
      # 9B) TICKET OF THE DAY PAYLOAD
      # ==================================================
      - name: Generate Ticket of the Day Shorts payload
        if: success()
        env:
          LANG: "en"
          WP_URL: https://greenbettips.com
          SHORTS_SITE_URL: https://greenbettips.com
          SHORTS_TICKET_TYPE: biletul_zilei
          SHORTS_OUTPUT_DIR: output/biletul_zilei
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/biletul_zilei

          node shorts/generate_shorts_payload.js

          if [ ! -s output/biletul_zilei/shorts_payload.json ]; then
            echo "Ticket of the Day payload was not generated."
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync(
                'output/biletul_zilei/shorts_payload.json',
                'utf8'
              )
            );

            console.log('Ticket of the Day status:', payload.status);
            console.log('Ticket type:', payload.ticketType);
            console.log('Ticket label:', payload.ticketLabel);
          "

      # ==================================================
      # 10) VERIFY CONTENT ENGINE FILES
      # ==================================================
      - name: Verify content engine files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "assets/presenters/presenter-01.mp4"
            "shorts/build_all_shorts.js"
            "shorts/render_short.js"
            "publish/generate_manifest.js"
            "publish/platforms/youtube.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "Required file is missing or empty: $FILE"
              exit 1
            fi

            echo "Found: $FILE"
          done

          echo "Presenter video details:"

          ffprobe \
            -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            assets/presenters/presenter-01.mp4

      # ==================================================
      # 11) BUILD ALL AVAILABLE SHORTS
      # ==================================================
      - name: Build all available Shorts
        if: success()
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail

          node shorts/build_all_shorts.js

          if [ ! -s output/build_summary.json ]; then
            echo "Build summary was not created."
            exit 1
          fi

          echo "Shorts build summary:"
          cat output/build_summary.json

      # ==================================================
      # 12) VERIFY GENERATED VIDEOS
      # ==================================================
      - name: Verify generated Shorts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          for TICKET_TYPE in bilet_cota2 biletul_zilei; do
            PAYLOAD="output/${TICKET_TYPE}/shorts_payload.json"
            VIDEO="output/${TICKET_TYPE}/short.mp4"
            MANIFEST="output/${TICKET_TYPE}/distribution_manifest.json"

            if [ ! -s "$PAYLOAD" ]; then
              echo "Missing payload: $PAYLOAD"
              exit 1
            fi

            STATUS=$(node -e "
              const fs = require('fs');
              const payload = JSON.parse(
                fs.readFileSync(process.argv[1], 'utf8')
              );
              process.stdout.write(payload.status || '');
            " "$PAYLOAD")

            echo ""
            echo "${TICKET_TYPE} status: ${STATUS}"

            if [ "$STATUS" = "skipped" ]; then
              echo "${TICKET_TYPE} was skipped because no suitable ticket exists."
              continue
            fi

            if [ "$STATUS" != "ready" ]; then
              echo "Unexpected payload status for ${TICKET_TYPE}: ${STATUS}"
              exit 1
            fi

            if [ ! -s "$VIDEO" ]; then
              echo "Missing rendered video: $VIDEO"
              exit 1
            fi

            if [ ! -s "$MANIFEST" ]; then
              echo "Missing distribution manifest: $MANIFEST"
              exit 1
            fi

            echo "Video details for ${TICKET_TYPE}:"

            ffprobe \
              -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$VIDEO"
          done

      # ==================================================
      # 13) TEST YOUTUBE OAUTH
      # ==================================================
      - name: Test YouTube OAuth credentials
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${YOUTUBE_CLIENT_ID:-}" ]; then
            echo "Missing GitHub secret: YOUTUBE_CLIENT_ID"
            exit 1
          fi

          if [ -z "${YOUTUBE_CLIENT_SECRET:-}" ]; then
            echo "Missing GitHub secret: YOUTUBE_CLIENT_SECRET"
            exit 1
          fi

          if [ -z "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            echo "Missing GitHub secret: YOUTUBE_REFRESH_TOKEN"
            exit 1
          fi

          RESPONSE=$(curl -sS \
            -X POST \
            https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${YOUTUBE_CLIENT_ID}" \
            --data-urlencode "client_secret=${YOUTUBE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${YOUTUBE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          node -e "
            const response = JSON.parse(process.argv[1]);

            if (!response.access_token) {
              console.error(
                'OAuth test failed:',
                response.error,
                response.error_description || ''
              );
              process.exit(1);
            }

            console.log('YouTube OAuth credentials are valid.');
            console.log(
              'Access token expires in:',
              response.expires_in,
              'seconds'
            );
          " "$RESPONSE"

      # ==================================================
      # 14) PUBLISH ALL AVAILABLE SHORTS TO YOUTUBE
      # ==================================================
      - name: Publish all available Shorts to YouTube
        if: success()
        timeout-minutes: 30
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PUBLISHED_COUNT=0
          SKIPPED_COUNT=0

          for TICKET_TYPE in bilet_cota2 biletul_zilei; do
            PAYLOAD="output/${TICKET_TYPE}/shorts_payload.json"
            VIDEO="output/${TICKET_TYPE}/short.mp4"
            MANIFEST="output/${TICKET_TYPE}/distribution_manifest.json"
            RESULTS="output/${TICKET_TYPE}/distribution_results.json"

            echo ""
            echo "=========================================="
            echo "Processing YouTube upload: ${TICKET_TYPE}"
            echo "=========================================="

            if [ ! -s "$PAYLOAD" ]; then
              echo "Payload is missing for ${TICKET_TYPE}. Skipping."
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            STATUS=$(node -e "
              const fs = require('fs');
              const payload = JSON.parse(
                fs.readFileSync(process.argv[1], 'utf8')
              );
              process.stdout.write(payload.status || '');
            " "$PAYLOAD")

            if [ "$STATUS" = "skipped" ]; then
              echo "${TICKET_TYPE} has no suitable ticket today. Upload skipped."
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            if [ "$STATUS" != "ready" ]; then
              echo "Unexpected payload status for ${TICKET_TYPE}: ${STATUS}"
              exit 1
            fi

            if [ ! -s "$VIDEO" ]; then
              echo "Rendered video is missing: $VIDEO"
              exit 1
            fi

            if [ ! -s "$MANIFEST" ]; then
              echo "Distribution manifest is missing: $MANIFEST"
              exit 1
            fi

            echo "Uploading ${TICKET_TYPE} to YouTube as PUBLIC..."

            DISTRIBUTION_MANIFEST_FILE="$MANIFEST" \
            DISTRIBUTION_RESULTS_FILE="$RESULTS" \
            node publish/platforms/youtube.js

            if [ ! -s "$RESULTS" ]; then
              echo "YouTube results file was not created: $RESULTS"
              exit 1
            fi

            RESULT_STATUS=$(node -e "
              const fs = require('fs');
              const result = JSON.parse(
                fs.readFileSync(process.argv[1], 'utf8')
              );
              process.stdout.write(result.status || '');
            " "$RESULTS")

            if [ "$RESULT_STATUS" != "success" ]; then
              echo "YouTube publishing failed for ${TICKET_TYPE}."
              cat "$RESULTS"
              exit 1
            fi

            node -e "
              const fs = require('fs');
              const result = JSON.parse(
                fs.readFileSync(process.argv[1], 'utf8')
              );

              console.log(
                'Video ID:',
                result.youtube?.videoId
              );

              console.log(
                'YouTube URL:',
                result.youtube?.url
              );

              console.log(
                'Privacy:',
                result.youtube?.privacyStatus
              );

              console.log(
                'Title:',
                result.youtube?.title
              );
            " "$RESULTS"

            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
          done

          echo ""
          echo "=========================================="
          echo "YOUTUBE PUBLISHING SUMMARY"
          echo "=========================================="
          echo "Published: ${PUBLISHED_COUNT}"
          echo "Skipped: ${SKIPPED_COUNT}"

          node -e "
            const fs = require('fs');

            const ticketTypes = [
              'bilet_cota2',
              'biletul_zilei'
            ];

            const results = [];

            for (const ticketType of ticketTypes) {
              const payloadFile =
                \`output/\${ticketType}/shorts_payload.json\`;

              const resultFile =
                \`output/\${ticketType}/distribution_results.json\`;

              let payload = null;
              let distribution = null;

              if (fs.existsSync(payloadFile)) {
                payload = JSON.parse(
                  fs.readFileSync(payloadFile, 'utf8')
                );
              }

              if (fs.existsSync(resultFile)) {
                distribution = JSON.parse(
                  fs.readFileSync(resultFile, 'utf8')
                );
              }

              results.push({
                ticketType,
                payloadStatus: payload?.status || 'missing',
                reason: payload?.reason || null,
                publishingStatus:
                  distribution?.status || 'not_published',
                youtube: distribution?.youtube || null
              });
            }

            const summary = {
              status: 'completed',
              generatedAt: new Date().toISOString(),
              publishedCount: Number(process.argv[1]),
              skippedCount: Number(process.argv[2]),
              results
            };

            fs.writeFileSync(
              'output/publishing_summary.json',
              JSON.stringify(summary, null, 2),
              'utf8'
            );
          " "$PUBLISHED_COUNT" "$SKIPPED_COUNT"

          cat output/publishing_summary.json

      # ==================================================
      # 15) UPLOAD FINAL ARTIFACT
      # ==================================================
      - name: Upload Shorts and publishing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenbettips-shorts-output
          path: |
            published_posts.json

            output/build_summary.json
            output/publishing_summary.json

            output/bilet_cota2/shorts_payload.json
            output/bilet_cota2/voice_script.txt
            output/bilet_cota2/voice.mp3
            output/bilet_cota2/subs.srt
            output/bilet_cota2/short.mp4
            output/bilet_cota2/distribution_manifest.json
            output/bilet_cota2/distribution_results.json
            output/bilet_cota2/render_text/

            output/biletul_zilei/shorts_payload.json
            output/biletul_zilei/voice_script.txt
            output/biletul_zilei/voice.mp3
            output/biletul_zilei/subs.srt
            output/biletul_zilei/short.mp4
            output/biletul_zilei/distribution_manifest.json
            output/biletul_zilei/distribution_results.json
            output/biletul_zilei/render_text/
          if-no-files-found: warn
          retention-days: 7
