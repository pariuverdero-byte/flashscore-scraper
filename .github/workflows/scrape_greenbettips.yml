name: Scrape Flashscore + Claudiu Pool + Generate Tickets + WordPress (EN)

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"  # rulează la 5 min după RO

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      # ------------------
      # GLOBAL CONTROLS
      # ------------------
      DAY_OFFSET: "0"
      INCLUDE_LIVE: "true"

      # ------------------
      # LANGUAGE FLAG
      # ------------------
      LANG: "en"

      # ------------------
      # CLAUDIU POOL RULES
      # ------------------
      CLAUDIU_MIN_ODD: "1.15"

      # ------------------
      # GREENBETTIPS TICKETS
      # (aceleași valori ca PV)
      # ------------------
      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"

      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"

      PV_COTA2_TOL: "0.00"
      PV_ZI_TOL: "0.00"

      # ------------------
      # OPTIONAL ODDS API
      # ------------------
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_REGION: "eu"

    steps:
      # ------------------
      # SETUP
      # ------------------
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-greenbettips
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install deps
        run: |
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 --no-fund --no-audit --prefer-offline

      # ------------------
      # 1) FLASHScore FIXTURES
      # ------------------
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ------------------
      # 2) FLASHScore ODDS
      # ------------------
      - name: Scrape Flashscore odds tab
        timeout-minutes: 5
        run: node scrape_odds_tab.js

      - name: Merge The Odds API (optional)
        timeout-minutes: 5
        run: |
          if [ -z "${ODDS_API_KEY}" ]; then
            echo "ODDS_API_KEY missing -> skipping"
          elif [ -f "scrape_odds_combo.js" ]; then
            node scrape_odds_combo.js
          else
            echo "scrape_odds_combo.js not present"
          fi

      - name: Build odds_extra (Double Chance)
        run: |
          if [ -f "build_odds_extra_from_1x2.js" ]; then
            node build_odds_extra_from_1x2.js
          else
            echo "build_odds_extra_from_1x2.js not present"
          fi

      # ------------------
      # 3) CLAUDIU POOL
      # ------------------
      - name: Build Claudiu Hood POOL
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ------------------
      # 4) TICKETS
      # ------------------
      - name: Generate tickets from pool
        timeout-minutes: 5
        run: node generate_tickets_from_pool.js

      # ------------------
      # 5) WORDPRESS HTML
      # ------------------
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ------------------
      # 6) PUBLISH WORDPRESS (EN)
      # ------------------
      - name: Publish posts to WordPress (greenbettips)
        if: success()
        env:
          WP_URL: https://greenbettips.com/wp-json/wp/v2
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
        run: node publish_wp.js
