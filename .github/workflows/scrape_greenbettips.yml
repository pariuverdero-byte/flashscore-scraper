name: Scrape Flashscore + Claudiu Pool + TalkFootball + PredictZ + Generate Tickets + WordPress (EN)

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *" # 14:35 RO during daylight saving time

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      DAY_OFFSET: "0"
      INCLUDE_LIVE: "true"
      LANG: "en"

      CLAUDIU_MIN_ODD: "1.15"

      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"
      PV_COTA2_TOL: "0.00"

      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"
      PV_ZI_TOL: "0.00"

    steps:
      # ------------------
      # SETUP
      # ------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-greenbettips
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: |
          npm install \
            cheerio@^1.0.0-rc.12 \
            node-fetch@^3 \
            googleapis \
            --no-fund \
            --no-audit \
            --prefer-offline

      # ------------------
      # 1) FLASHSCORE
      # ------------------
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ------------------
      # 2) CLAUDIU
      # ------------------
      - name: Build Claudiu Hood pool
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ------------------
      # 3) TALKFOOTBALL
      # ------------------
      - name: Scrape TalkFootball
        timeout-minutes: 5
        run: node scrapers/scrape_talkfootball.js

      - name: Match TalkFootball to Flashscore
        timeout-minutes: 5
        run: node engine/match_talkfootball_flashscore.js

      - name: Inject TalkFootball into master pool
        timeout-minutes: 5
        run: node parsers/parse_talkfootball_as_odds.js

      # ------------------
      # 4) PREDICTZ
      # ------------------
      - name: Scrape PredictZ
        timeout-minutes: 5
        run: node scrapers/scrape_predictz.js

      - name: Match PredictZ to Flashscore
        timeout-minutes: 5
        run: node engine/match_predictz_flashscore.js

      - name: Inject PredictZ into master pool
        timeout-minutes: 5
        run: node parsers/parse_predictz_as_odds.js

      # ------------------
      # 5) GENERATE TICKETS
      # ------------------
      - name: Generate tickets from master pool
        timeout-minutes: 5
        run: node generate_tickets_from_pool.js

      # ------------------
      # 6) WORDPRESS HTML
      # ------------------
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ------------------
      # 7) RAW ARTIFACTS
      # ------------------
      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output
          path: |
            matches.json
            claudiu_pool.json
            master_pool.json

            predictz_pool.json
            predictz_matched.json

            predictz_match_tips.html
            predictz_btts.html
            predictz_btts_and_win.html
            predictz_over_under_25.html

            claudiu_cota2.html
            claudiu_biletul_zilei.html
            claudiu_varianta_speciala.html
            claudiu_varianta_rezerva.html
            claudiu_varianta_islanda.html

            artifacts/talkfootball_pool.json
            artifacts/talkfootball_matched.json
            artifacts/talkfootball_dropped.json
          if-no-files-found: warn

      - name: Upload ticket artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets
          path: |
            tickets.json
            tickets.md
            cota2.html
            biletul-zilei.html
          if-no-files-found: warn

      # ------------------
      # 8) WORDPRESS PUBLISHING
      # ------------------
      - name: Publish posts to WordPress
        if: success()
        env:
          WP_URL: https://greenbettips.com
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
        run: node publish_wp.js

      # ------------------
      # 9A) ODDS 2 SHORTS PAYLOAD
      # ------------------
      - name: Generate Odds 2 Shorts payload
        if: success()
        env:
          LANG: "en"
          WP_URL: https://greenbettips.com
          SHORTS_SITE_URL: https://greenbettips.com
          SHORTS_TICKET_TYPE: bilet_cota2
          SHORTS_OUTPUT_DIR: output/bilet_cota2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/bilet_cota2

          node shorts/generate_shorts_payload.js

          if [ ! -s output/bilet_cota2/shorts_payload.json ]; then
            echo "Odds 2 payload was not generated."
            exit 1
          fi

          echo "Odds 2 payload generated successfully."

          node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync(
                'output/bilet_cota2/shorts_payload.json',
                'utf8'
              )
            );

            console.log('Status:', payload.status);
            console.log('Ticket type:', payload.ticketType);
            console.log('Ticket label:', payload.ticketLabel);
          "

      # ------------------
      # 9B) TICKET OF THE DAY SHORTS PAYLOAD
      # ------------------
      - name: Generate Ticket of the Day Shorts payload
        if: success()
        env:
          LANG: "en"
          WP_URL: https://greenbettips.com
          SHORTS_SITE_URL: https://greenbettips.com
          SHORTS_TICKET_TYPE: biletul_zilei
          SHORTS_OUTPUT_DIR: output/biletul_zilei
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/biletul_zilei

          node shorts/generate_shorts_payload.js

          if [ ! -s output/biletul_zilei/shorts_payload.json ]; then
            echo "Ticket of the Day payload was not generated."
            exit 1
          fi

          echo "Ticket of the Day payload generated successfully."

          node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync(
                'output/biletul_zilei/shorts_payload.json',
                'utf8'
              )
            );

            console.log('Status:', payload.status);
            console.log('Ticket type:', payload.ticketType);
            console.log('Ticket label:', payload.ticketLabel);
          "

      # ------------------
      # 9C) KEEP CURRENT ODDS 2 PIPELINE COMPATIBLE
      # ------------------
      - name: Prepare Odds 2 payload for existing video pipeline
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s output/bilet_cota2/shorts_payload.json ]; then
            echo "Odds 2 Shorts payload is missing."
            exit 1
          fi

          STATUS=$(node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync(
                'output/bilet_cota2/shorts_payload.json',
                'utf8'
              )
            );
            process.stdout.write(payload.status || '');
          ")

          if [ "$STATUS" = "skipped" ]; then
            echo "Odds 2 ticket was skipped."
            cp \
              output/bilet_cota2/shorts_payload.json \
              output/shorts_payload.json
            exit 0
          fi

          if [ "$STATUS" != "ready" ]; then
            echo "Unexpected Odds 2 payload status: $STATUS"
            exit 1
          fi

          cp \
            output/bilet_cota2/shorts_payload.json \
            output/shorts_payload.json

          cp \
            output/bilet_cota2/voice_script.txt \
            output/voice_script.txt

          echo "Odds 2 payload copied to the existing pipeline paths."

          ls -lh \
            output/shorts_payload.json \
            output/voice_script.txt

      # ------------------
      # 10) SET UP EDGE TTS
      # ------------------
      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Edge TTS
        if: success()
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts

      # ------------------
      # 11) GENERATE ODDS 2 VOICE + SUBTITLES
      # ------------------
      - name: Generate Shorts voice and subtitles
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f output/shorts_payload.json ]; then
            echo "output/shorts_payload.json does not exist."
            exit 1
          fi

          STATUS=$(node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync('output/shorts_payload.json', 'utf8')
            );
            process.stdout.write(payload.status || '');
          ")

          if [ "$STATUS" = "skipped" ]; then
            echo "Shorts generation was skipped because no suitable Odds 2 ticket was generated."
            exit 0
          fi

          if [ "$STATUS" != "ready" ]; then
            echo "Unexpected Shorts payload status: $STATUS"
            exit 1
          fi

          if [ ! -s output/voice_script.txt ]; then
            echo "output/voice_script.txt is missing or empty."
            exit 1
          fi

          echo "Generating English Odds 2 voice and synchronized subtitles..."

          edge-tts \
            --voice "en-US-GuyNeural" \
            --rate="+5%" \
            --volume="+0%" \
            --file output/voice_script.txt \
            --write-media output/voice.mp3 \
            --write-subtitles output/subs.srt

          if [ ! -s output/voice.mp3 ]; then
            echo "Voice generation failed: output/voice.mp3 is missing or empty."
            exit 1
          fi

          if [ ! -s output/subs.srt ]; then
            echo "Subtitle generation failed: output/subs.srt is missing or empty."
            exit 1
          fi

          cp output/voice.mp3 output/bilet_cota2/voice.mp3
          cp output/subs.srt output/bilet_cota2/subs.srt

          echo "Odds 2 voice and subtitles generated successfully."

          ls -lh \
            output/shorts_payload.json \
            output/voice_script.txt \
            output/voice.mp3 \
            output/subs.srt

      # ------------------
      # 12) INSTALL FFMPEG + FONTS
      # ------------------
      - name: Install FFmpeg and fonts
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core

          ffmpeg -version
          ffprobe -version

      # ------------------
      # 13) VERIFY PRESENTER VIDEO
      # ------------------
      - name: Verify presenter video
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f assets/presenters/presenter-01.mp4 ]; then
            echo "Presenter video not found:"
            echo "assets/presenters/presenter-01.mp4"
            exit 1
          fi

          if [ ! -s assets/presenters/presenter-01.mp4 ]; then
            echo "Presenter video exists but is empty."
            exit 1
          fi

          echo "Presenter video found successfully."

          ffprobe \
            -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            assets/presenters/presenter-01.mp4

      # ------------------
      # 14) RENDER ODDS 2 YOUTUBE SHORT
      # ------------------
      - name: Render YouTube Short
        if: success()
        env:
          SHORTS_PAYLOAD_FILE: output/shorts_payload.json
          SHORTS_PRESENTER_FILE: assets/presenters/presenter-01.mp4
          SHORTS_AUDIO_FILE: output/voice.mp3
          SHORTS_SUBTITLES_FILE: output/subs.srt
          SHORTS_VIDEO_FILE: output/short.mp4
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync('output/shorts_payload.json', 'utf8')
            );
            process.stdout.write(payload.status || '');
          ")

          if [ "$STATUS" = "skipped" ]; then
            echo "Video rendering skipped because no suitable Odds 2 ticket was generated."
            exit 0
          fi

          node shorts/render_short.js

          if [ ! -s output/short.mp4 ]; then
            echo "Video rendering failed: output/short.mp4 is missing or empty."
            exit 1
          fi

          cp output/short.mp4 output/bilet_cota2/short.mp4

          echo "Checking generated YouTube Short..."

          ffprobe \
            -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/short.mp4

      # ------------------
      # 15) VALIDATE ODDS 2 SHORT FORMAT
      # ------------------
      - name: Validate YouTube Short
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f output/short.mp4 ]; then
            echo "No Short was generated. Validation skipped."
            exit 0
          fi

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/short.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/short.mp4)

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            output/short.mp4)

          echo "Width: $WIDTH"
          echo "Height: $HEIGHT"
          echo "Duration: $DURATION seconds"

          if [ "$WIDTH" != "1080" ]; then
            echo "Invalid width. Expected 1080."
            exit 1
          fi

          if [ "$HEIGHT" != "1920" ]; then
            echo "Invalid height. Expected 1920."
            exit 1
          fi

          awk -v duration="$DURATION" 'BEGIN {
            if (duration > 60) {
              print "Video is longer than 60 seconds.";
              exit 1;
            }
          }'

          echo "YouTube Short validation passed."

      # ------------------
      # 16) GENERATE ODDS 2 DISTRIBUTION MANIFEST
      # ------------------
      - name: Generate distribution manifest
        if: success()
        env:
          SHORTS_PAYLOAD_FILE: output/shorts_payload.json
          SHORTS_VIDEO_FILE: output/short.mp4
          DISTRIBUTION_MANIFEST_FILE: output/distribution_manifest.json
          YOUTUBE_PRIVACY_STATUS: public
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f output/shorts_payload.json ]; then
            echo "Shorts payload does not exist."
            exit 1
          fi

          STATUS=$(node -e "
            const fs = require('fs');
            const payload = JSON.parse(
              fs.readFileSync('output/shorts_payload.json', 'utf8')
            );
            process.stdout.write(payload.status || '');
          ")

          if [ "$STATUS" = "skipped" ]; then
            echo "Distribution manifest skipped because no suitable Odds 2 ticket was generated."
            exit 0
          fi

          if [ "$STATUS" != "ready" ]; then
            echo "Unexpected Shorts payload status: $STATUS"
            exit 1
          fi

          if [ ! -s output/short.mp4 ]; then
            echo "No rendered Short exists. Distribution manifest generation skipped."
            exit 0
          fi

          if [ ! -f publish/generate_manifest.js ]; then
            echo "Manifest generator not found:"
            echo "publish/generate_manifest.js"
            exit 1
          fi

          node publish/generate_manifest.js

          if [ ! -s output/distribution_manifest.json ]; then
            echo "Distribution manifest was not created or is empty."
            exit 1
          fi

          cp \
            output/distribution_manifest.json \
            output/bilet_cota2/distribution_manifest.json

          echo "Distribution manifest generated successfully."

          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(
              fs.readFileSync(
                'output/distribution_manifest.json',
                'utf8'
              )
            );

            console.log('Content ID:', manifest.content?.id);
            console.log('Video:', manifest.media?.video);
            console.log(
              'YouTube enabled:',
              manifest.platforms?.youtube?.enabled
            );
            console.log(
              'YouTube privacy:',
              manifest.platforms?.youtube?.privacyStatus
            );
            console.log(
              'YouTube title:',
              manifest.platforms?.youtube?.title
            );
          "

      # ------------------
      # YOUTUBE OAUTH TEST
      # ------------------
      - name: Test YouTube OAuth credentials
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -X POST \
            https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${YOUTUBE_CLIENT_ID}" \
            --data-urlencode "client_secret=${YOUTUBE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${YOUTUBE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          node -e "
            const response = JSON.parse(process.argv[1]);

            if (!response.access_token) {
              console.error(
                'OAuth test failed:',
                response.error,
                response.error_description || ''
              );
              process.exit(1);
            }

            console.log('YouTube OAuth credentials are valid.');
            console.log(
              'Access token expires in:',
              response.expires_in,
              'seconds'
            );
          " "$RESPONSE"

      # ------------------
      # 17) VERIFY YOUTUBE PUBLISHER
      # ------------------
      - name: Verify YouTube publisher configuration
        if: success()
        shell: bash
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -s output/distribution_manifest.json ]; then
            echo "No distribution manifest exists. YouTube publishing skipped."
            exit 0
          fi

          if [ ! -f publish/platforms/youtube.js ]; then
            echo "YouTube publisher was not found:"
            echo "publish/platforms/youtube.js"
            exit 1
          fi

          if [ -z "${YOUTUBE_CLIENT_ID:-}" ]; then
            echo "Missing GitHub secret: YOUTUBE_CLIENT_ID"
            exit 1
          fi

          if [ -z "${YOUTUBE_CLIENT_SECRET:-}" ]; then
            echo "Missing GitHub secret: YOUTUBE_CLIENT_SECRET"
            exit 1
          fi

          if [ -z "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            echo "Missing GitHub secret: YOUTUBE_REFRESH_TOKEN"
            exit 1
          fi

          echo "YouTube publisher and required credentials are configured."

      # ------------------
      # 18) PUBLISH ODDS 2 TO YOUTUBE
      # ------------------
      - name: Publish Short to YouTube
        if: success()
        timeout-minutes: 15
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          DISTRIBUTION_MANIFEST_FILE: output/distribution_manifest.json
          DISTRIBUTION_RESULTS_FILE: output/distribution_results.json
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s output/distribution_manifest.json ]; then
            echo "Distribution manifest is missing. YouTube publishing skipped."
            exit 0
          fi

          if [ ! -s output/short.mp4 ]; then
            echo "Rendered Short is missing. YouTube publishing skipped."
            exit 0
          fi

          echo "Uploading Odds 2 Short to YouTube as a public video..."

          node publish/platforms/youtube.js

          if [ ! -s output/distribution_results.json ]; then
            echo "YouTube upload result was not created."
            exit 1
          fi

          STATUS=$(node -e "
            const fs = require('fs');
            const result = JSON.parse(
              fs.readFileSync(
                'output/distribution_results.json',
                'utf8'
              )
            );
            process.stdout.write(result.status || '');
          ")

          if [ "$STATUS" != "success" ]; then
            echo "YouTube publishing did not return success."
            cat output/distribution_results.json
            exit 1
          fi

          cp \
            output/distribution_results.json \
            output/bilet_cota2/distribution_results.json

          echo "YouTube upload completed successfully."

          node -e "
            const fs = require('fs');
            const result = JSON.parse(
              fs.readFileSync(
                'output/distribution_results.json',
                'utf8'
              )
            );

            console.log(
              'YouTube video ID:',
              result.youtube?.videoId
            );

            console.log(
              'YouTube URL:',
              result.youtube?.url
            );

            console.log(
              'Privacy:',
              result.youtube?.privacyStatus
            );
          "

      # ------------------
      # 19) SHORTS + DISTRIBUTION ARTIFACT
      # ------------------
      - name: Upload Shorts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output
          path: |
            published_posts.json

            output/bilet_cota2/
            output/biletul_zilei/

            output/shorts_payload.json
            output/voice_script.txt
            output/voice.mp3
            output/subs.srt
            output/short.mp4
            output/distribution_manifest.json
            output/distribution_results.json
            output/render_text/
          if-no-files-found: warn
