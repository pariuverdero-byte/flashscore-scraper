name: Live Betting Feed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: live-betting-feed
  cancel-in-progress: false

jobs:
  live-feed:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      PV_LIVE_ENDPOINT: ${{ secrets.PV_LIVE_ENDPOINT }}
      PV_LIVE_TOKEN: ${{ secrets.PV_LIVE_TOKEN }}

      GBT_LIVE_ENDPOINT: ${{ secrets.GBT_LIVE_ENDPOINT }}
      GBT_LIVE_TOKEN: ${{ secrets.GBT_LIVE_TOKEN }}

      LIVE_MAX_MATCHES: "15"
      LIVE_POLL_SECONDS: "75"

      PREMATCH_CACHE_HOURS: "12"
      PREMATCH_MAX_FETCHES_PER_CYCLE: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Restore live state
        uses: actions/cache/restore@v4
        with:
          path: |
            live-betting/data/live_matches.json
            live-betting/data/signals.json
            live-betting/data/live_feed.json
            live-betting/data/pre_match_cache.json
          key: live-betting-state-${{ github.run_id }}
          restore-keys: |
            live-betting-state-

      - name: Build live feed
        run: node live-betting/scripts/run-once.js

      - name: Save live state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            live-betting/data/live_matches.json
            live-betting/data/signals.json
            live-betting/data/live_feed.json
            live-betting/data/pre_match_cache.json
          key: live-betting-state-${{ github.run_id }}

      - name: Upload debug feed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-betting-feed-${{ github.run_id }}
          path: |
            live-betting/data/live_feed.json
            live-betting/data/live_matches.json
            live-betting/data/signals.json
            live-betting/data/pre_match_cache.json
          if-no-files-found: warn
          retention-days: 3
