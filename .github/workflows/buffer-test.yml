name: Test Buffer connection

on:
  workflow_dispatch:
    inputs:
      account:
        description: Buffer account to verify
        required: true
        type: choice
        default: pariuverde
        options:
          - pariuverde
          - greenbettips

jobs:
  test-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Buffer API and connected channels
        env:
          BUFFER_API_KEY: ${{ inputs.account == 'greenbettips' && secrets.BUFFER_GBT_API_KEY || secrets.BUFFER_API_KEY }}
          BUFFER_ACCOUNT: ${{ inputs.account }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const apiKey = String(process.env.BUFFER_API_KEY || '').trim();
          if (!apiKey) throw new Error('BUFFER_API_KEY is missing');
          async function request(query) {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query })
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length) throw new Error(body.errors?.map(e => e.message).join('; ') || `HTTP ${response.status}`);
            return body.data;
          }
          const account = await request('query { account { organizations { id name } } }');
          const organizations = account.account?.organizations || [];
          if (organizations.length !== 1) throw new Error(`Expected one organization, found ${organizations.length}`);
          const org = organizations[0];
          const data = await request(`query { channels(input: { organizationId: "${org.id}" }) { name displayName service isQueuePaused } }`);
          const allowed = ['tiktok', 'instagram', 'facebook'];
          const services = data.channels.map(channel => String(channel.service).toLowerCase());
          console.log(`Buffer organization: ${org.name}`);
          for (const channel of data.channels) console.log(`Connected: ${channel.service} / ${channel.displayName || channel.name}`);
          const supported = services.filter(service => allowed.includes(service));
          if (!supported.length) throw new Error(`No supported social channels connected for ${process.env.BUFFER_ACCOUNT}`);
          if (process.env.BUFFER_ACCOUNT === 'pariuverde') {
            const missing = allowed.filter(service => !services.includes(service));
            if (missing.length) throw new Error(`Missing required PariuVerde channels: ${missing.join(', ')}`);
          }
          console.log(`Buffer connection is ready for ${supported.join(', ')}.`);
          NODE
