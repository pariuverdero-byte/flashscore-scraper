name: Test parse10pariuri_cota2

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install cheerio

      - name: Run parser test (with undici shim)
        run: node --require ./scripts/undici_shim.cjs scripts/test_parse_10pariuri.js
