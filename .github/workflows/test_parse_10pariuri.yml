name: Test parse10pariuri_cota2

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run parser test
        run: node scripts/test_parse_10pariuri.js
