name: Test parse 10pariuri multi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install cheerio

      - name: Run parser test
        run: node --require ./scripts/undici_shim.cjs scripts/test_parse_10pariuri_multi.js
