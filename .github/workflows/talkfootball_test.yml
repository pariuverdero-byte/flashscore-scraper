name: Test TalkFootball + Flashscore MOBI

on:
  workflow_dispatch:

jobs:
  test-flow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install cheerio

      - name: Scrape TalkFootball
        run: node scrapers/scrape_talkfootball.js

      - name: Scrape Flashscore (MOBI)
        run: node scrapers/scrape_flashscore_today.js

      - name: Match TalkFootball → Flashscore
        run: node engine/match_talkfootball_flashscore.js

      - name: Show results
        run: |
          echo "=== MATCHED ==="
          cat artifacts/talkfootball_matched.json
          echo ""
          echo "=== DROPPED ==="
          cat artifacts/talkfootball_dropped.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkfootball_flashscore_mobi
          path: artifacts/
