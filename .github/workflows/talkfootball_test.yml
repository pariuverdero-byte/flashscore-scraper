name: Test TalkFootball Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: HARD RESET node_modules
        run: |
          rm -rf node_modules
          rm -rf package-lock.json
          npm cache clean --force

      - name: Install cheerio ONLY
        run: npm install cheerio

      - name: Run scraper
        run: node scrapers/scrape_talkfootball.js

      - name: Show output
        run: cat artifacts/talkfootball_pool.json
