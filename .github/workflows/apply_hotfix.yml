name: One-time verifier hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply_hotfix.yml"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch final-status parser
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("verify_and_update_wp.js")
          text = p.read_text(encoding="utf-8")
          old = r'(?:Finished|Full Time|Final|FT|AET)(?=\d|\s|$)'
          new = r'(?:Finished|Full Time|Final\b|AET\b|FT\b)'
          count = text.count(old)

          if count == 0 and text.count(new) == 3:
              print("Parser is already patched.")
          elif count == 3:
              text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")
              print("Updated final-status parser in 3 places.")
          else:
              raise SystemExit(f"Unexpected parser state: old={count}, new={text.count(new)}")
          PY

          node --check verify_and_update_wp.js
          grep -nE 'Finished\|Full Time\|Final' verify_and_update_wp.js

      - name: Commit verifier fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify_and_update_wp.js

          if git diff --cached --quiet; then
            echo "No verifier changes to commit."
          else
            git commit -m "Fix Flashscore finished status parsing"
            git push origin main
          fi

      - name: Install verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 --no-fund --no-audit --prefer-offline

      - name: Recheck PariuVerde ticket results now
        continue-on-error: true
        timeout-minutes: 8
        env:
          LANG: "ro"
          WP_BASE: "https://pariuverde.ro"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          RECHECK_ONCE: "1"
          RECHECK_LAST_N: "15"
          MAX_ROWS_PER_POST: "10"
          WP_TIMEOUT_MS: "15000"
          WP_RETRIES: "2"
          WP_RETRY_DELAY_MS: "3000"
          FS_TIMEOUT_MS: "8000"
          VERIFY_NON_BLOCKING: "true"
        run: node verify_and_update_wp.js

      - name: Recheck GreenBetTips ticket results now
        continue-on-error: true
        timeout-minutes: 8
        env:
          LANG: "en"
          WP_BASE: "https://greenbettips.com"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
          RECHECK_ONCE: "1"
          RECHECK_LAST_N: "15"
          MAX_ROWS_PER_POST: "10"
          WP_TIMEOUT_MS: "15000"
          WP_RETRIES: "2"
          WP_RETRY_DELAY_MS: "3000"
          FS_TIMEOUT_MS: "8000"
          VERIFY_NON_BLOCKING: "true"
        run: node verify_and_update_wp.js
