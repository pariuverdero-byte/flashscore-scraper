name: One-time pipeline hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply_hotfix.yml"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact hotfixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly 1 occurrence in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"Updated {path}: {old!r} -> {new!r}")

          replace_once(
              ".github/workflows/scrape.yml",
              '- cron: "00 12 * * *"',
              '- cron: "30 13 * * *"',
          )

          replace_once(
              ".github/workflows/scrape_greenbettips.yml",
              '# 13:30 UTC = 14:30 in Romania during daylight-saving time (summer).',
              '# 13:30 UTC = 16:30 in Romania during daylight-saving time (summer).',
          )

          replace_once(
              ".github/workflows/scrape_greenbettips.yml",
              '- cron: "30 11 * * *"',
              '- cron: "30 13 * * *"',
          )

          p = Path("verify_and_update_wp.js")
          text = p.read_text(encoding="utf-8")
          old = r'(?:Finished|Full Time|Final|FT|AET)(?=\d|\s|$)'
          new = r'(?:Finished|Full Time|Final\b|AET\b|FT\b)'
          count = text.count(old)
          if count != 3:
              raise SystemExit(
                  f"Expected 3 final-status regex occurrences in verify_and_update_wp.js, found {count}"
              )
          text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")
          print(f"Updated verify_and_update_wp.js final-status regex in {count} places")
          PY

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail

          echo "PariuVerde schedule:"
          grep -n 'cron:' .github/workflows/scrape.yml

          echo "GreenBetTips schedule:"
          grep -n 'cron:' .github/workflows/scrape_greenbettips.yml

          echo "Final-status parser patterns:"
          grep -nE 'Finished\|Full Time\|Final' verify_and_update_wp.js

          node --check verify_and_update_wp.js

      - name: Commit corrected production files and remove hotfix runner
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/apply_hotfix.yml
          git add \
            .github/workflows/scrape.yml \
            .github/workflows/scrape_greenbettips.yml \
            verify_and_update_wp.js

          git commit -m "Fix ticket verification and 16:30 daily schedules"
          git push origin main

      - name: Install verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 --no-fund --no-audit --prefer-offline

      - name: Recheck PariuVerde ticket results now
        continue-on-error: true
        timeout-minutes: 8
        env:
          LANG: "ro"
          WP_BASE: "https://pariuverde.ro"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          RECHECK_ONCE: "1"
          RECHECK_LAST_N: "15"
          MAX_ROWS_PER_POST: "10"
          WP_TIMEOUT_MS: "15000"
          WP_RETRIES: "2"
          WP_RETRY_DELAY_MS: "3000"
          FS_TIMEOUT_MS: "8000"
          VERIFY_NON_BLOCKING: "true"
        run: node verify_and_update_wp.js

      - name: Recheck GreenBetTips ticket results now
        continue-on-error: true
        timeout-minutes: 8
        env:
          LANG: "en"
          WP_BASE: "https://greenbettips.com"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS_GREENBET }}
          RECHECK_ONCE: "1"
          RECHECK_LAST_N: "15"
          MAX_ROWS_PER_POST: "10"
          WP_TIMEOUT_MS: "15000"
          WP_RETRIES: "2"
          WP_RETRY_DELAY_MS: "3000"
          FS_TIMEOUT_MS: "8000"
          VERIFY_NON_BLOCKING: "true"
        run: node verify_and_update_wp.js
