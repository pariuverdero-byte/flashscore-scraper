name: Scrape Flashscore + Claudiu Pool + Generate Tickets + WordPress (RO)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"  # 07:30 Europe/Bucharest

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      # ------------------
      # GLOBAL CONTROLS
      # ------------------
      DAY_OFFSET: "0"          # 0 = azi
      INCLUDE_LIVE: "true"

      # ------------------
      # CLAUDIU POOL RULES
      # ------------------
      CLAUDIU_MIN_ODD: "1.15"

      # ------------------
      # PARIUVERDE – COTA 2
      # ------------------
      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"
      PV_COTA2_TOL: "0.00"

      # ------------------
      # PARIUVERDE – BILETUL ZILEI
      # ------------------
      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"
      PV_ZI_TOL: "0.00"

    steps:
      # ------------------
      # SETUP
      # ------------------
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pariuverde
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install deps
        run: |
          npm install cheerio@^1.0.0-rc.12 node-fetch@^3 --no-fund --no-audit --prefer-offline

      # ------------------
      # 1) FLASHScore FIXTURES (meciuri)
      # ------------------
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ------------------
      # 2) CLAUDIU HOOD → POOL
      # ------------------
      - name: Build Claudiu Hood POOL
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ------------------
      # 3) GENERATE PARIUVERDE TICKETS
      # ------------------
      - name: Generate PariuVerde tickets from pool
        timeout-minutes: 5
        run: node generate_tickets_from_pool.js

      # ------------------
      # 4) GENERATE WORDPRESS HTML
      # ------------------
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ------------------
      # 5) ARTIFACTS (DEBUG / TRACE)
      # ------------------
      - name: Upload artifacts (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output
          path: |
            matches.json
            claudiu_pool.json

      - name: Upload artifacts (tickets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets
          path: |
            tickets.json
            cota2.html
            biletul-zilei.html

      # ------------------
      # 6) PUBLISH → PARIUVERDE.RO
      # ------------------
      - name: Publish posts to WordPress (pariuverde.ro)
        if: success()
        env:
          WP_URL: https://pariuverde.ro
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: node publish_wp.js
