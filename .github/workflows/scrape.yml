name: PariuVerde Daily Tickets + WordPress + YouTube Shorts

concurrency:
  group: pariuverde-daily-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    # 11:30 UTC = 14:30 in Romania during daylight-saving time (summer)
    # and 13:30 during standard time (winter).
    - cron: "30 11 * * *"

jobs:
  scrape-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      # ==================================================
      # GENERAL SCRAPING CONFIGURATION
      # ==================================================
      DAY_OFFSET: "0"
      INCLUDE_LIVE: "true"
      LANG: "ro"

      CLAUDIU_MIN_ODD: "1.15"

      PV_COTA2_MIN: "1.90"
      PV_COTA2_MAX: "2.50"
      PV_TARGET_COTA2: "2.05"
      PV_COTA2_TOL: "0.00"

      PV_ZI_MIN: "3.50"
      PV_ZI_MAX: "7.00"
      PV_TARGET_ZI: "5.00"
      PV_ZI_TOL: "0.00"

      # ==================================================
      # PARIUVERDE BRANDING
      # ==================================================
      SHORTS_BRAND_NAME: "PariuVerde"
      SHORTS_BRAND_DISPLAY: "PARIUVERDE"

      SHORTS_WEBSITE: "pariuverde.ro"
      SHORTS_WEBSITE_DISPLAY: "WWW.PARIUVERDE.RO"
      SHORTS_SITE_URL: "https://pariuverde.ro"

      # ==================================================
      # CONTENT ENGINE
      # ==================================================
      SHORTS_OUTPUT_ROOT: "output"
      SHORTS_PRESENTER_FILES: "assets/intros/ro/intro_01.mp4,assets/intros/ro/intro_02.mp4,assets/intros/ro/intro_03.mp4,assets/intros/ro/intro_04.mp4,assets/intros/ro/intro_05.mp4,assets/intros/ro/intro_06.mp4,assets/intros/ro/intro_07.mp4"

      SHORTS_TTS_VOICE: "ro-RO-EmilNeural"
      SHORTS_TTS_RATE: "+1%"
      SHORTS_TTS_PITCH: "+1Hz"
      VOICE_PROVIDER: "piper"
      PIPER_VOICE: "ro_RO-mihai-medium"
      PIPER_DATA_DIR: ".cache/piper"

      SHORTS_PRESENTER_SCALE_MIN: "0.88"
      SHORTS_PRESENTER_SCALE_MAX: "1.02"
      SHORTS_PRESENTER_OFFSET_X_MIN: "-110"
      SHORTS_PRESENTER_OFFSET_X_MAX: "110"
      SHORTS_PRESENTER_OFFSET_Y_MIN: "10"
      SHORTS_PRESENTER_OFFSET_Y_MAX: "70"
      SHORTS_PRESENTER_MIRROR_CHANCE: "0.35"

      SHORTS_BACKGROUND_CHANGE_MIN_SECONDS: "3"
      SHORTS_BACKGROUND_CHANGE_MAX_SECONDS: "6"
      SHORTS_BACKGROUND_VARIANT_COUNT: "18"

      # ==================================================
      # DISTRIBUTION CONFIGURATION
      # ==================================================
      YOUTUBE_ENABLED: "true"
      YOUTUBE_PRIVACY_STATUS: "public"

      TIKTOK_ENABLED: "false"
      INSTAGRAM_ENABLED: "false"
      FACEBOOK_ENABLED: "false"
      TELEGRAM_ENABLED: "false"

    steps:
      # ==================================================
      # SETUP
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Running npm ci..."
            npm ci --no-fund --no-audit --prefer-offline
          else
            echo "No package-lock.json found. Installing required packages..."
            npm install \
              cheerio@^1.0.0-rc.12 \
              node-fetch@^3 \
              googleapis \
              --no-fund \
              --no-audit \
              --prefer-offline
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Piper Romanian voice cache
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-ro-RO-mihai-medium-v1

      - name: Install Romanian voice engines
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet edge-tts piper-tts
          edge-tts --version

      - name: Verify FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg and ffprobe are already available on the GitHub runner."
          else
            echo "FFmpeg is missing. Installing minimum required packages..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends \
              ffmpeg \
              fonts-dejavu-core
          fi

          if ! fc-match DejaVuSans >/dev/null 2>&1; then
            echo "DejaVu fonts are missing. Installing fonts-dejavu-core..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends \
              fonts-dejavu-core
          fi

          echo "FFmpeg:"
          ffmpeg -version | head -n 3

          echo "FFprobe:"
          ffprobe -version | head -n 3

          echo "Font:"
          fc-match DejaVuSans | head -n 1

      # ==================================================
      # 1) FLASHSCORE
      # ==================================================
      - name: Scrape Flashscore fixtures
        timeout-minutes: 5
        run: node scrape_mobi.js

      # ==================================================
      # 2) CLAUDIU POOL
      # ==================================================
      - name: Build Claudiu Hood pool
        timeout-minutes: 5
        run: node scrape_claudiu_pool.js

      # ==================================================
      # 3) TALKFOOTBALL
      # ==================================================
      - name: Scrape TalkFootball
        timeout-minutes: 5
        run: node scrapers/scrape_talkfootball.js

      - name: Match TalkFootball to Flashscore
        timeout-minutes: 5
        run: node engine/match_talkfootball_flashscore.js

      - name: Inject TalkFootball into master pool
        timeout-minutes: 5
        run: node parsers/parse_talkfootball_as_odds.js

      # ==================================================
      # 4) PREDICTZ
      # ==================================================
      - name: Scrape PredictZ
        timeout-minutes: 5
        run: node scrapers/scrape_predictz.js

      - name: Match PredictZ to Flashscore
        timeout-minutes: 5
        run: node engine/match_predictz_flashscore.js

      - name: Inject PredictZ into master pool
        timeout-minutes: 5
        run: node parsers/parse_predictz_as_odds.js

      # ==================================================
      # 5) GENERATE TICKETS
      # ==================================================
      - name: Generate tickets from master pool
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna"
        run: node generate_tickets_from_pool.js

      # ==================================================
      # 6) WORDPRESS HTML
      # ==================================================
      - name: Generate WordPress HTML
        run: node generate_wp.js

      # ==================================================
      # 7) RAW ARTIFACTS
      # ==================================================
      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pariuverde-raw-output
          path: |
            matches.json
            claudiu_pool.json
            master_pool.json

            predictz_pool.json
            predictz_matched.json

            claudiu_cota2.html
            claudiu_biletul_zilei.html
            claudiu_varianta_speciala.html
            claudiu_varianta_rezerva.html
            claudiu_varianta_islanda.html

            predictz_match_tips.html
            predictz_btts.html
            predictz_btts_and_win.html
            predictz_over_under_25.html

            artifacts/talkfootball_pool.json
            artifacts/talkfootball_matched.json
            artifacts/talkfootball_dropped.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ticket artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pariuverde-tickets
          path: |
            tickets.json
            tickets.md
            cota2.html
            biletul-zilei.html
          if-no-files-found: warn
          retention-days: 7

      # ==================================================
      # 8) WORDPRESS PUBLISHING
      # ==================================================
      - name: Publish posts to WordPress
        if: success()
        env:
          WP_URL: https://pariuverde.ro
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: node publish_wp.js

      # ==================================================
      # 8B) VERIFY PREVIOUS WORDPRESS TICKETS
      # ==================================================
      - name: Verify tickets on pariuverde.ro
        if: success()
        continue-on-error: true
        timeout-minutes: 8
        env:
          LANG: "ro"

          WP_BASE: "https://pariuverde.ro"
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}

          RECHECK_ONCE: "1"
          RECHECK_LAST_N: "15"
          MAX_ROWS_PER_POST: "10"

          WP_TIMEOUT_MS: "15000"
          WP_RETRIES: "2"
          WP_RETRY_DELAY_MS: "3000"

          FS_TIMEOUT_MS: "8000"

          # If SiteGround/SG Captcha blocks /wp-json/,
          # report the issue but continue the main workflow.
          VERIFY_NON_BLOCKING: "true"
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s verify_and_update_wp.js ]; then
            echo "verify_and_update_wp.js is missing or empty."
            exit 1
          fi

          echo "Starting WordPress ticket verification..."
          node verify_and_update_wp.js
          echo "WordPress verification step completed."

      # ==================================================
      # 9A) GENERATE BILET COTA 2 PAYLOAD
      # ==================================================
      - name: Generate Bilet Cota 2 Shorts payload
        if: success()
        env:
          SHORTS_TICKET_TYPE: bilet_cota2
          SHORTS_OUTPUT_DIR: output/bilet_cota2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/bilet_cota2

          node shorts/generate_shorts_payload.js

          if [ ! -s output/bilet_cota2/shorts_payload.json ]; then
            echo "Payload-ul pentru Bilet Cota 2 nu a fost creat."
            exit 1
          fi

          node -e "
            const fs = require('fs');

            const payload = JSON.parse(
              fs.readFileSync(
                'output/bilet_cota2/shorts_payload.json',
                'utf8'
              )
            );

            console.log('Status:', payload.status);
            console.log('Limba:', payload.language);
            console.log('Brand:', payload.brand?.name);
            console.log('Tip bilet:', payload.ticketType);
            console.log('Denumire:', payload.ticketLabel);
            console.log('Selecții:', payload.selections?.length || 0);
          "

      # ==================================================
      # 9B) GENERATE BILETUL ZILEI PAYLOAD
      # ==================================================
      - name: Generate Biletul Zilei Shorts payload
        if: success()
        env:
          SHORTS_TICKET_TYPE: biletul_zilei
          SHORTS_OUTPUT_DIR: output/biletul_zilei
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/biletul_zilei

          node shorts/generate_shorts_payload.js

          if [ ! -s output/biletul_zilei/shorts_payload.json ]; then
            echo "Payload-ul pentru Biletul Zilei nu a fost creat."
            exit 1
          fi

          node -e "
            const fs = require('fs');

            const payload = JSON.parse(
              fs.readFileSync(
                'output/biletul_zilei/shorts_payload.json',
                'utf8'
              )
            );

            console.log('Status:', payload.status);
            console.log('Limba:', payload.language);
            console.log('Brand:', payload.brand?.name);
            console.log('Tip bilet:', payload.ticketType);
            console.log('Denumire:', payload.ticketLabel);
            console.log('Selecții:', payload.selections?.length || 0);
          "

      # ==================================================
      # 10) VERIFY REQUIRED CONTENT FILES
      # ==================================================
      - name: Verify PariuVerde content engine files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "assets/intros/ro/intro_01.mp4"
            "shorts/generate_shorts_payload.js"
            "shorts/build_all_shorts.js"
            "shorts/render_short.js"
            "scripts/generate_voice.js"
            "publish/generate_manifest.js"
            "publish/platforms/youtube.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "Fișier obligatoriu lipsă sau gol: $FILE"
              exit 1
            fi

            echo "Găsit: $FILE"
          done

          echo "Detalii prezentator PariuVerde:"

          ffprobe \
            -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            assets/intros/ro/intro_01.mp4

      # ==================================================
      # 11) BUILD ALL AVAILABLE ROMANIAN SHORTS
      # ==================================================
      - name: Build all available PariuVerde Shorts
        if: success()
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail

          node shorts/build_all_shorts.js

          if [ ! -s output/build_summary.json ]; then
            echo "Build summary nu a fost creat."
            exit 1
          fi

          echo "Rezumat generare videoclipuri:"
          cat output/build_summary.json

      # ==================================================
      # 12) VERIFY GENERATED SHORTS
      # ==================================================
      - name: Verify generated PariuVerde Shorts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          for TICKET_TYPE in bilet_cota2 biletul_zilei; do
            PAYLOAD="output/${TICKET_TYPE}/shorts_payload.json"
            VIDEO="output/${TICKET_TYPE}/short.mp4"
            MANIFEST="output/${TICKET_TYPE}/distribution_manifest.json"

            if [ ! -s "$PAYLOAD" ]; then
              echo "Payload lipsă: $PAYLOAD"
              exit 1
            fi

            STATUS=$(node -e "
              const fs = require('fs');

              const payload = JSON.parse(
                fs.readFileSync(
                  process.argv[1],
                  'utf8'
                )
              );

              process.stdout.write(
                payload.status || ''
              );
            " "$PAYLOAD")

            echo ""
            echo "${TICKET_TYPE}: ${STATUS}"

            if [ "$STATUS" = "skipped" ]; then
              echo "${TICKET_TYPE} nu a fost generat. Videoclipul este omis."
              continue
            fi

            if [ "$STATUS" != "ready" ]; then
              echo "Status neașteptat pentru ${TICKET_TYPE}: ${STATUS}"
              exit 1
            fi

            if [ ! -s "$VIDEO" ]; then
              echo "Videoclip lipsă: $VIDEO"
              exit 1
            fi

            if [ ! -s "$MANIFEST" ]; then
              echo "Manifest lipsă: $MANIFEST"
              exit 1
            fi

            echo "Detalii video pentru ${TICKET_TYPE}:"

            ffprobe \
              -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$VIDEO"

            node -e "
              const fs = require('fs');

              const manifest = JSON.parse(
                fs.readFileSync(
                  process.argv[1],
                  'utf8'
                )
              );

              console.log(
                'Brand:',
                manifest.brand?.name
              );

              console.log(
                'Titlu YouTube:',
                manifest.platforms?.youtube?.title
              );

              console.log(
                'Confidențialitate:',
                manifest.platforms?.youtube?.privacyStatus
              );
            " "$MANIFEST"
          done

      # ==================================================
      # 13) TEST YOUTUBE PARIUVERDE OAUTH
      # ==================================================
      - name: Test PariuVerde YouTube OAuth credentials
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_PV_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_PV_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_PV_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${YOUTUBE_CLIENT_ID:-}" ]; then
            echo "Lipsește secretul YOUTUBE_PV_CLIENT_ID."
            exit 1
          fi

          if [ -z "${YOUTUBE_CLIENT_SECRET:-}" ]; then
            echo "Lipsește secretul YOUTUBE_PV_CLIENT_SECRET."
            exit 1
          fi

          if [ -z "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            echo "Lipsește secretul YOUTUBE_PV_REFRESH_TOKEN."
            exit 1
          fi

          RESPONSE=$(curl -sS \
            -X POST \
            https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${YOUTUBE_CLIENT_ID}" \
            --data-urlencode "client_secret=${YOUTUBE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${YOUTUBE_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          node -e "
            const response = JSON.parse(
              process.argv[1]
            );

            if (!response.access_token) {
              console.error(
                'Test OAuth eșuat:',
                response.error,
                response.error_description || ''
              );

              process.exit(1);
            }

            console.log(
              'Credențialele YouTube PariuVerde sunt valide.'
            );

            console.log(
              'Token valabil:',
              response.expires_in,
              'secunde'
            );
          " "$RESPONSE"

      # ==================================================
      # 14) PUBLISH ALL AVAILABLE SHORTS TO YOUTUBE
      # ==================================================
      - name: Publish all available PariuVerde Shorts to YouTube
        if: success()
        timeout-minutes: 30
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_PV_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_PV_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_PV_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PUBLISHED_COUNT=0
          SKIPPED_COUNT=0

          for TICKET_TYPE in bilet_cota2 biletul_zilei; do
            PAYLOAD="output/${TICKET_TYPE}/shorts_payload.json"
            VIDEO="output/${TICKET_TYPE}/short.mp4"
            MANIFEST="output/${TICKET_TYPE}/distribution_manifest.json"
            RESULTS="output/${TICKET_TYPE}/distribution_results.json"

            echo ""
            echo "=========================================="
            echo "Publicare YouTube: ${TICKET_TYPE}"
            echo "=========================================="

            if [ ! -s "$PAYLOAD" ]; then
              echo "Payload lipsă. Publicarea este omisă."
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            STATUS=$(node -e "
              const fs = require('fs');

              const payload = JSON.parse(
                fs.readFileSync(
                  process.argv[1],
                  'utf8'
                )
              );

              process.stdout.write(
                payload.status || ''
              );
            " "$PAYLOAD")

            if [ "$STATUS" = "skipped" ]; then
              echo "${TICKET_TYPE} nu este disponibil astăzi."
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            if [ "$STATUS" != "ready" ]; then
              echo "Status neașteptat pentru ${TICKET_TYPE}: ${STATUS}"
              exit 1
            fi

            if [ ! -s "$VIDEO" ]; then
              echo "Videoclip lipsă: $VIDEO"
              exit 1
            fi

            if [ ! -s "$MANIFEST" ]; then
              echo "Manifest lipsă: $MANIFEST"
              exit 1
            fi

            echo "Se publică ${TICKET_TYPE} ca videoclip PUBLIC..."

            DISTRIBUTION_MANIFEST_FILE="$MANIFEST" \
            DISTRIBUTION_RESULTS_FILE="$RESULTS" \
            node publish/platforms/youtube.js

            if [ ! -s "$RESULTS" ]; then
              echo "Fișierul cu rezultatul publicării nu a fost creat."
              exit 1
            fi

            RESULT_STATUS=$(node -e "
              const fs = require('fs');

              const result = JSON.parse(
                fs.readFileSync(
                  process.argv[1],
                  'utf8'
                )
              );

              process.stdout.write(
                result.status || ''
              );
            " "$RESULTS")

            if [ "$RESULT_STATUS" != "success" ]; then
              echo "Publicarea YouTube a eșuat pentru ${TICKET_TYPE}."
              cat "$RESULTS"
              exit 1
            fi

            node -e "
              const fs = require('fs');

              const result = JSON.parse(
                fs.readFileSync(
                  process.argv[1],
                  'utf8'
                )
              );

              console.log(
                'Video ID:',
                result.youtube?.videoId
              );

              console.log(
                'URL:',
                result.youtube?.url
              );

              console.log(
                'Canal:',
                result.youtube?.channelTitle
              );

              console.log(
                'Vizibilitate:',
                result.youtube?.privacyStatus
              );

              console.log(
                'Titlu:',
                result.youtube?.title
              );
            " "$RESULTS"

            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
          done

          echo ""
          echo "=========================================="
          echo "REZUMAT PUBLICARE YOUTUBE PARIUVERDE"
          echo "=========================================="
          echo "Publicate: ${PUBLISHED_COUNT}"
          echo "Omise: ${SKIPPED_COUNT}"

          PUBLISHED_COUNT="$PUBLISHED_COUNT" \
          SKIPPED_COUNT="$SKIPPED_COUNT" \
          node <<'NODE'
          const fs = require('fs');

          const ticketTypes = [
            'bilet_cota2',
            'biletul_zilei'
          ];

          const results = [];

          for (const ticketType of ticketTypes) {
            const payloadFile =
              `output/${ticketType}/shorts_payload.json`;

            const resultFile =
              `output/${ticketType}/distribution_results.json`;

            let payload = null;
            let distribution = null;

            if (fs.existsSync(payloadFile)) {
              payload = JSON.parse(
                fs.readFileSync(
                  payloadFile,
                  'utf8'
                )
              );
            }

            if (fs.existsSync(resultFile)) {
              distribution = JSON.parse(
                fs.readFileSync(
                  resultFile,
                  'utf8'
                )
              );
            }

            results.push({
              ticketType,
              payloadStatus:
                payload?.status || 'missing',
              reason:
                payload?.reason || null,
              publishingStatus:
                distribution?.status ||
                'not_published',
              youtube:
                distribution?.youtube || null
            });
          }

          const summary = {
            status: 'completed',
            brand: 'PariuVerde',
            language: 'ro',
            generatedAt:
              new Date().toISOString(),
            publishedCount:
              Number(process.env.PUBLISHED_COUNT || 0),
            skippedCount:
              Number(process.env.SKIPPED_COUNT || 0),
            results
          };

          fs.writeFileSync(
            'output/publishing_summary.json',
            JSON.stringify(
              summary,
              null,
              2
            ),
            'utf8'
          );
          NODE

          cat output/publishing_summary.json

      - name: Embed published PariuVerde videos in WordPress articles
        if: success()
        env:
          WP_URL: https://pariuverde.ro
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          LANG: ro
        run: node embed_youtube_wp.js

      # ==================================================
      # 15) UPLOAD FINAL ARTIFACT
      # ==================================================
      - name: Upload PariuVerde Shorts output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pariuverde-shorts-output
          path: |
            published_posts.json

            output/build_summary.json
            output/publishing_summary.json

            output/bilet_cota2/shorts_payload.json
            output/bilet_cota2/voice_script.txt
            output/bilet_cota2/voice.mp3
            output/bilet_cota2/subs.srt
            output/bilet_cota2/short.mp4
            output/bilet_cota2/distribution_manifest.json
            output/bilet_cota2/distribution_results.json
            output/bilet_cota2/render_text/

            output/biletul_zilei/shorts_payload.json
            output/biletul_zilei/voice_script.txt
            output/biletul_zilei/voice.mp3
            output/biletul_zilei/subs.srt
